<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>УРОБОРОС — Журнал колонии</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap');
  :root {
    --bg:#04060f; --panel-bg:rgba(6,12,28,0.92); --border:rgba(60,130,200,0.18);
    --accent:#2a7fff; --accent2:#00e5ff; --text:#8baac8; --text-bright:#cce4ff;
    --mono:'Share Tech Mono',monospace; --sans:'Rajdhani',sans-serif;
    --gold:#ffcf6b; --ok:#44cc88; --err:#ff5544; --warn:#ff8060;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--bg);color:var(--text);font-family:var(--sans);height:100%;}
  body{display:flex;flex-direction:column;overflow:hidden;}

  header{flex-shrink:0;display:flex;align-items:center;gap:14px;padding:8px 16px;
    border-bottom:1px solid var(--border);background:var(--panel-bg);}
  .logo{font-family:var(--mono);font-size:12px;letter-spacing:3px;color:var(--accent2);white-space:nowrap;}
  .logo span{color:var(--text);opacity:.6;letter-spacing:1px;}
  .hdr-sync{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--text);display:flex;align-items:center;gap:5px;}
  .hdr-dot{width:6px;height:6px;border-radius:50%;background:var(--text);}
  .hdr-dot.ok{background:var(--ok);box-shadow:0 0 4px var(--ok);}
  .hdr-dot.err{background:var(--err);}
  .hdr-actions{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .btn{font-family:var(--mono);font-size:10px;letter-spacing:1px;background:transparent;
    border:1px solid var(--border);color:var(--text);padding:5px 12px;cursor:pointer;white-space:nowrap;}
  .btn:hover{border-color:var(--accent2);color:var(--accent2);}
  select{background:rgba(0,0,0,0.4);border:1px solid var(--border);color:var(--text-bright);
    font-family:var(--mono);font-size:10px;padding:5px 8px;outline:none;}

  .content{flex:1;overflow-y:auto;padding:12px 16px;}

  .day-block{background:var(--panel-bg);border:1px solid var(--border);margin-bottom:12px;}
  .day-head{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:7px 12px;
    background:rgba(255,255,255,0.02);border-bottom:1px solid var(--border);
    font-family:var(--mono);font-size:10.5px;}
  .day-head .day-num{color:var(--accent2);letter-spacing:1px;}
  .day-head .stat{color:var(--text);}
  .day-head .stat b{color:var(--text-bright);font-weight:400;}
  .day-head .demolished{color:var(--err);}
  .day-head .demolished b{font-weight:400;}

  table.log{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:10px;}
  table.log th{text-align:right;padding:4px 10px;color:var(--text);opacity:.65;font-weight:normal;
    letter-spacing:.5px;white-space:nowrap;border-bottom:1px solid rgba(100,130,160,0.1);}
  table.log th:first-child{text-align:left;}
  table.log td{text-align:right;padding:3px 10px;color:var(--text-bright);white-space:nowrap;}
  table.log td:first-child{text-align:left;color:var(--text);}
  table.log tr:nth-child(even) td{background:rgba(255,255,255,0.012);}
  .pos{color:var(--ok);}
  .neg{color:var(--warn);}
  .zero{opacity:.35;}
  .delta{display:inline-block;margin-left:6px;font-size:8.5px;opacity:.8;}
  .delta-up{color:var(--ok);}
  .delta-down{color:var(--warn);}
  .delta-flat{color:var(--text);opacity:.4;}

  .empty-note{padding:20px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--text);opacity:.6;}

  #offline{position:fixed;inset:0;background:rgba(4,6,15,0.95);z-index:80;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
  #offline.show{display:flex;}
  #offline .off-title{font-family:var(--mono);font-size:13px;letter-spacing:1px;color:var(--warn);}
  #offline .off-text{font-family:var(--mono);font-size:10px;color:var(--text);line-height:1.8;text-align:center;}
</style>
</head>
<body>

<header>
  <div class="logo">УРОБОРОС <span>· ЖУРНАЛ КОЛОНИИ</span></div>
  <div class="hdr-sync"><div class="hdr-dot" id="hdr-dot"></div><span id="hdr-sync-label">—</span></div>
  <div class="hdr-actions">
    <select id="colony-select"><option value="">— выберите колонию —</option></select>
    <button class="btn" id="btn-refresh">↻ ОБНОВИТЬ</button>
  </div>
</header>

<div class="content" id="content">
  <div class="empty-note">Выберите колонию выше.</div>
</div>

<div id="offline">
  <div class="off-title">НЕТ СВЯЗИ С СЕРВЕРОМ</div>
  <div class="off-text" id="off-text"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════
// ЖУРНАЛ КОЛОНИИ — по требованию пользователя: табличный лог за каждые сутки
// (добыча/производство/расход/снос/остаток всех ресурсов), отдельная
// страница, переход из админ-панели («ЖУРНАЛ КОЛОНИИ →», admin-panel.js).
// Источник данных — Planet.EventLog (server/production.go, logDayEntry),
// отдаётся отдельным эндпоинтом /api/planet/log (НЕ едет в /api/galaxy —
// тот опрашивается раз в секунду всеми экранами, лог за 60 суток раздул бы
// его). Имена ресурсов/компонентов — из /api/economy (resources+recipes),
// тот же приём, что client/planet.html whResInfo/whItemName.
//
// Дельта день-ко-дню (по требованию пользователя — «а то ото дня ко дню
// сравнивать сложно») — ЧИСТО КЛИЕНТСКИЙ расчёт поверх уже полученного
// журнала (computeDelta/deltaSpan), без повторной перемотки сервера: для
// каждой ячейки (Добыто/Произведено/Потрачено/Остаток) рядом со значением
// показывается разница с тем же показателем в предыдущей записи журнала
// (▲/▼ зелёным/оранжевым, «·0» тускло — если не изменилось). У самой первой
// (старейшей) записи предыдущей нет — дельта не показывается.
// ══════════════════════════════════════════════════════════════════════════

let nameByKey = {};
let colonies = []; // [{starId, planetIndex, label}]

async function loadEconomyNames() {
  try {
    const res = await fetch('api/economy', { cache:'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    (data.resources || []).forEach(r => { nameByKey[r.key] = r.name; });
    (data.recipes || []).forEach(r => { nameByKey[r.key] = r.name; });
  } catch (e) { /* имена — не критично, останутся сырые ключи */ }
}

function resName(key) { return nameByKey[key] || key; }

async function loadColonies() {
  try {
    const res = await fetch('api/galaxy', { cache:'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    colonies = [];
    (data.objects || []).forEach(o => {
      if (o.type !== 'star' || !o.planets) return;
      o.planets.forEach(p => {
        if (p.capital) colonies.push({ starId: o.id, planetIndex: p.i, label: `${o.faction} (звезда #${o.id})` });
      });
    });
    const sel = document.getElementById('colony-select');
    const prev = sel.value;
    sel.innerHTML = '<option value="">— выберите колонию —</option>' +
      colonies.map(c => `<option value="${c.starId}:${c.planetIndex}">${c.label}</option>`).join('');
    if (prev) sel.value = prev;
    setSync(true);
  } catch (e) {
    setSync(false, e.message);
  }
}

function setSync(ok, msg) {
  document.getElementById('hdr-dot').className = 'hdr-dot ' + (ok ? 'ok' : 'err');
  document.getElementById('hdr-sync-label').textContent = ok ? 'LIVE' : 'ERR';
  const off = document.getElementById('offline');
  if (ok) {
    off.classList.remove('show');
  } else {
    document.getElementById('off-text').innerHTML =
      'Журнал работает только через сервер.<br>Запустите <b>server</b> (см. server/README.md).<br><br>' + (msg || '');
    off.classList.add('show');
  }
}

function fmt(n) {
  if (n === undefined || n === null) return '0';
  return Math.round(n * 10) / 10 === Math.trunc(n) ? String(Math.trunc(n)) : n.toFixed(1);
}

async function loadLog() {
  const sel = document.getElementById('colony-select');
  const [starId, planetIndex] = (sel.value || '').split(':');
  const content = document.getElementById('content');
  if (!starId) {
    content.innerHTML = '<div class="empty-note">Выберите колонию выше.</div>';
    return;
  }
  try {
    const res = await fetch(`api/planet/log?starId=${starId}&planetIndex=${planetIndex}`, { cache:'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    renderLog(data.log || []);
    setSync(true);
  } catch (e) {
    setSync(false, e.message);
  }
}

function renderLog(log) {
  const content = document.getElementById('content');
  if (log.length === 0) {
    content.innerHTML = '<div class="empty-note">Журнал пуст — колония ещё не прожила ни одних игровых суток с момента запуска сервера.</div>';
    return;
  }
  // Сравнение день ко дню (по требованию пользователя — «а то ото дня ко
  // дню сравнивать сложно») считаем в ХРОНОЛОГИЧЕСКОМ порядке (log с сервера
  // уже такой — самые старые сутки первые), потом разворачиваем для
  // отображения (новые сверху) — берём готовый Planet.EventLog как есть, без
  // повторной перемотки/пересчёта на сервере.
  const withPrev = log.map((entry, i) => ({ entry, prev: i > 0 ? log[i - 1] : null }));
  withPrev.reverse();
  content.innerHTML = withPrev.map(({ entry, prev }) => renderDay(entry, prev)).join('');
}

// computeDelta — разница ЗНАЧЕНИЯ ключа k в категории (mined/produced/
// consumed/stock) между текущими и предыдущими сутками; null, если
// предыдущих суток нет (самая первая запись журнала).
function computeDelta(entry, prevEntry, category, key) {
  if (!prevEntry) return null;
  const c = (entry[category] || {})[key] || 0;
  const p = (prevEntry[category] || {})[key] || 0;
  return c - p;
}

function deltaSpan(delta) {
  if (delta === null || delta === undefined) return '';
  if (Math.abs(delta) < 0.05) return '<span class="delta delta-flat">·0</span>';
  const cls = delta > 0 ? 'delta delta-up' : 'delta delta-down';
  const arrow = delta > 0 ? '▲' : '▼';
  return `<span class="${cls}">${arrow}${fmt(Math.abs(delta))}</span>`;
}

function renderDay(entry, prev) {
  const keys = new Set([
    ...Object.keys(entry.mined || {}),
    ...Object.keys(entry.produced || {}),
    ...Object.keys(entry.consumed || {}),
    ...Object.keys(entry.stock || {}),
  ]);
  const rows = [...keys].sort((a, b) => resName(a).localeCompare(resName(b), 'ru')).map(k => {
    const mined = (entry.mined || {})[k] || 0;
    const produced = (entry.produced || {})[k] || 0;
    const consumed = (entry.consumed || {})[k] || 0;
    const stock = (entry.stock || {})[k] || 0;
    if (!mined && !produced && !consumed && !stock) return '';
    const dMined = computeDelta(entry, prev, 'mined', k);
    const dProduced = computeDelta(entry, prev, 'produced', k);
    const dConsumed = computeDelta(entry, prev, 'consumed', k);
    const dStock = computeDelta(entry, prev, 'stock', k);
    return `<tr>
      <td>${resName(k)}</td>
      <td class="${mined ? 'pos' : 'zero'}">${mined ? '+' + fmt(mined) : '—'}${deltaSpan(dMined)}</td>
      <td class="${produced ? 'pos' : 'zero'}">${produced ? '+' + fmt(produced) : '—'}${deltaSpan(dProduced)}</td>
      <td class="${consumed ? 'neg' : 'zero'}">${consumed ? '−' + fmt(consumed) : '—'}${deltaSpan(dConsumed)}</td>
      <td>${fmt(stock)}${deltaSpan(dStock)}</td>
    </tr>`;
  }).join('');
  const demolished = (entry.demolished || []);
  const demCounts = {};
  demolished.forEach(t => { demCounts[t] = (demCounts[t] || 0) + 1; });
  const demText = Object.keys(demCounts).length
    ? Object.entries(demCounts).map(([t, n]) => `${resName(t)}×${n}`).join(', ')
    : null;
  return `<div class="day-block">
    <div class="day-head">
      <span class="day-num">СУТКИ ${entry.day}</span>
      <span class="stat">население: <b>${entry.population}</b></span>
      <span class="stat">зданий: <b>${entry.buildings}</b></span>
      ${demText ? `<span class="demolished">⚠ демонтировано: <b>${demText}</b></span>` : ''}
    </div>
    <table class="log">
      <thead><tr><th>Ресурс</th><th>Добыто</th><th>Произведено</th><th>Потрачено</th><th>Остаток</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" style="text-align:center;opacity:.5;">нет движения</td></tr>'}</tbody>
    </table>
  </div>`;
}

document.getElementById('colony-select').onchange = loadLog;
document.getElementById('btn-refresh').onclick = () => { loadColonies(); loadLog(); };

(async function init() {
  await loadEconomyNames();
  await loadColonies();
  await loadLog();
  setInterval(loadLog, 3000);
  setInterval(loadColonies, 10000);
})();
</script>
</body>
</html>
