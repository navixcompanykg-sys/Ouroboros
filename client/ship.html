<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>УРОБОРОС — HUD корабля</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap');
  :root {
    --bg:#04060f; --panel-bg:rgba(6,12,28,0.92); --border:rgba(60,130,200,0.18);
    --accent:#2a7fff; --accent2:#00e5ff; --text:#8baac8; --text-bright:#cce4ff;
    --mono:'Share Tech Mono',monospace; --sans:'Rajdhani',sans-serif;
    --danger:#ff5040; --steer:#ffb347;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{height:100%;overflow:hidden;background:#000;}
  body{font-family:var(--sans);color:var(--text);
    display:flex;align-items:center;justify-content:center;}

  /* ── рамка «телефона»: фиксированные пропорции 390×844 (референс — iPhone 12/13/14) ── */
  #screen{position:relative;
    width:min(92vw, 400px, calc(94vh * 390 / 844));
    aspect-ratio:390/844;
    background:var(--bg);overflow:hidden;
    border-radius:34px;border:2px solid #14161e;
    box-shadow:0 0 0 1px rgba(255,255,255,0.03), 0 20px 60px rgba(0,0,0,0.7);}

  /* ── космос: вращается относительно курса, а не корабль ── */
  #space{position:absolute;inset:-40%;transition:transform .25s ease-out;}
  #space canvas{width:100%;height:100%;display:block;}
  /* Слой реального мира в масштабе 1:1 поверх звёздного фона */
  #world-layer{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;}
  .w-planet{stroke:rgba(255,255,255,0.35);stroke-width:0.004;}
  .w-star{stroke-width:0.004;}
  .w-label{font-family:var(--mono);fill:var(--text-bright);opacity:.75;}

  /* ── корабль-заглушка: смещён от центра к нижней трети экрана,
     ориентация всегда «вперёд/вверх экрана» — не вращается ────────── */
  #ship-wrap{position:absolute;left:50%;top:68%;transform:translate(-50%,-50%);
    pointer-events:none;z-index:5;}
  #ship-svg{width:56px;height:56px;overflow:visible;filter:drop-shadow(0 0 6px rgba(0,229,255,0.55));transition:filter .3s;}
  #ship-wrap.boost #ship-svg{filter:drop-shadow(0 0 14px rgba(255,150,60,0.85));}
  .sail{opacity:0;transition:opacity .4s;}
  #ship-wrap.sails .sail{opacity:0.85;}
  .flame{opacity:0;transform-origin:50% 0%;transition:opacity .2s;}
  #ship-wrap.boost .flame{opacity:1;animation:flick .12s infinite alternate;}
  #ship-wrap.brake .brake-glow{opacity:1;}
  .brake-glow{opacity:0;transition:opacity .2s;}
  @keyframes flick{to{transform:scaleY(1.25);}}

  /* ── верхние угловые кнопки (круги) ─────────────────────── */
  .corner-btn{position:absolute;top:14px;width:46px;height:46px;border-radius:50%;
    background:var(--panel-bg);border:1.5px solid var(--accent);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:25;
    font-family:var(--mono);font-size:15px;color:var(--accent2);}
  .corner-btn:active{border-color:var(--accent2);background:rgba(0,229,255,0.1);}
  #btn-menu{left:14px;}
  #btn-galaxy{right:14px;}

  /* ── боковые манёвренные регуляторы (слева/справа), на уровне корабля ── */
  .steer{position:absolute;top:68%;transform:translateY(-50%);width:38px;height:150px;z-index:22;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:linear-gradient(180deg, rgba(255,179,71,0.05), rgba(255,179,71,0.16), rgba(255,179,71,0.05));
    border:1.4px solid var(--steer);
    clip-path:polygon(50% 0%, 100% 22%, 62% 50%, 100% 78%, 50% 100%, 0% 78%, 38% 50%, 0% 22%);
    transition:background .15s, filter .15s;}
  .steer:active,.steer.active{background:linear-gradient(180deg, rgba(255,179,71,0.12), rgba(255,179,71,0.4), rgba(255,179,71,0.12));
    filter:drop-shadow(0 0 8px rgba(255,179,71,0.6));}
  .steer.left{left:10px;}
  .steer.right{right:10px;}
  .steer-arrow{font-size:20px;color:var(--steer);line-height:1;}
  .steer-label{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:7px;letter-spacing:1px;color:var(--steer);opacity:.7;white-space:nowrap;}

  /* ── нижний ряд: список / меню / радар ──────────────────── */
  /* Бюджет ширины под design 390px: 8+92+6+163+6+92+8 = 375 (с запасом) */
  .bottom-row{position:absolute;left:0;right:0;bottom:12px;display:flex;align-items:flex-end;
    justify-content:center;padding:0 8px;z-index:15;gap:6px;}

  #object-list{width:92px;height:92px;background:var(--panel-bg);border:1px solid var(--border);
    backdrop-filter:blur(6px);display:flex;flex-direction:column;overflow:hidden;cursor:pointer;flex-shrink:0;
    transition:height .25s ease-out;}
  #object-list.expanded{height:300px;overflow-y:auto;} /* до нижнего края боковых регуляторов (design 390×844) */
  #object-list .ol-rows{flex:1;padding:4px 0;}
  .ol-row{display:flex;align-items:center;gap:5px;padding:3px 6px;font-family:var(--mono);font-size:8.5px;}
  .ol-row-selected{background:rgba(0,229,255,0.14);}
  .ol-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .ol-name{color:var(--text-bright);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ol-dist{color:var(--text);opacity:.6;}

  #radar-wrap{width:92px;height:92px;flex-shrink:0;background:var(--panel-bg);border:1px solid var(--border);
    border-radius:50%;backdrop-filter:blur(6px);cursor:pointer;position:relative;}
  #radar-wrap svg{width:100%;height:100%;}
  .radar-sweep{transform-origin:60px 60px;animation:sweep 3.5s linear infinite;}
  @keyframes sweep{to{transform:rotate(360deg);}}
  .radar-blip{opacity:.9;cursor:pointer;}
  .radar-blip-selected{stroke:#fff;stroke-width:1;}
  .radar-route{stroke:var(--accent2);stroke-width:1;stroke-dasharray:3 2;opacity:.85;pointer-events:none;}
  #radar-label{position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);font-family:var(--mono);
    font-size:7px;color:var(--text);opacity:.5;letter-spacing:1px;white-space:nowrap;}
  #radar-fly-btn{position:absolute;left:50%;top:-32px;transform:translateX(-50%);
    background:var(--panel-bg);border:1.2px solid var(--accent2);color:var(--accent2);
    font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:5px 12px;
    cursor:pointer;white-space:nowrap;display:none;z-index:30;}
  #radar-fly-btn.show{display:block;}
  #radar-fly-btn:active{background:rgba(0,229,255,0.16);}

  /* ── меню трёх кнопок (центр, форма «летающей тарелки») ── */
  #three-menu{flex-shrink:0;width:163px;display:flex;flex-direction:column;align-items:center;}
  .tm-strip{width:100%;height:14px;cursor:pointer;background:var(--panel-bg);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8px;
    color:var(--text);opacity:.55;}
  .tm-strip:active{opacity:1;color:var(--accent2);}
  #tm-up{clip-path:polygon(15% 100%, 50% 0%, 85% 100%);border-bottom:none;}
  #tm-down{clip-path:polygon(15% 0%, 50% 100%, 85% 0%);border-top:none;}
  .tm-setname{width:100%;text-align:center;font-family:var(--mono);font-size:8px;letter-spacing:3px;
    color:var(--accent);opacity:.9;padding:3px 0;background:var(--panel-bg);border-left:1px solid var(--border);
    border-right:1px solid var(--border);}
  .tm-buttons{display:flex;gap:1px;width:100%;background:var(--panel-bg);border:1px solid var(--border);
    border-top:none;border-bottom:none;backdrop-filter:blur(6px);}
  .tm-btn{flex:1;padding:8px 2px;text-align:center;font-family:var(--sans);font-size:9.5px;font-weight:600;
    color:var(--text-bright);cursor:pointer;border-right:1px solid var(--border);line-height:1.15;}
  .tm-btn:last-child{border-right:none;}
  .tm-btn:active,.tm-btn.active{background:rgba(0,229,255,0.1);color:var(--accent2);}

  /* ── модалка-заглушка ───────────────────────────────────── */
  #modal{position:absolute;inset:0;background:rgba(4,6,15,0.88);display:none;align-items:center;
    justify-content:center;z-index:50;}
  #modal.open{display:flex;}
  #modal-box{width:80%;max-width:320px;background:var(--panel-bg);border:1px solid var(--border);
    padding:18px;backdrop-filter:blur(8px);}
  #modal-title{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--accent2);margin-bottom:10px;}
  #modal-body{font-size:13px;line-height:1.6;color:var(--text-bright);margin-bottom:16px;white-space:pre-line;}
  #modal-close{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--text);
    border:1px solid var(--border);padding:6px 14px;cursor:pointer;float:right;}
  #modal-close:active{border-color:var(--accent2);color:var(--accent2);}

  /* ── тост ───────────────────────────────────────────────── */
  #toast{position:absolute;left:50%;bottom:212px;transform:translateX(-50%) translateY(10px);
    background:var(--panel-bg);border:1px solid var(--accent2);color:var(--accent2);
    font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:8px 14px;z-index:60;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="screen">

  <div id="space">
    <canvas id="space-canvas"></canvas>
    <!-- Мир в масштабе 1:1 (1 клеть = ширина экрана, ТЗ.md §2.7.4). Лежит
         внутри #space, поэтому вращается вместе с ним при смене курса —
         вращается пространство, а не корабль (ТЗ_UI.md §2.1.2). -->
    <svg id="world-layer" preserveAspectRatio="xMidYMid slice"></svg>
  </div>

  <div id="ship-wrap">
    <svg id="ship-svg" viewBox="-27 -27 54 54">
      <polygon class="sail" points="-2,-4 -22,2 -2,6" fill="rgba(200,225,255,0.18)" stroke="rgba(200,225,255,0.5)" stroke-width="0.7"/>
      <polygon class="sail" points="2,-4 22,2 2,6" fill="rgba(200,225,255,0.18)" stroke="rgba(200,225,255,0.5)" stroke-width="0.7"/>
      <ellipse class="brake-glow" cx="0" cy="-6" rx="10" ry="4" fill="rgba(255,80,60,0.35)"/>
      <polygon points="0,-14 8,10 0,6 -8,10" fill="#1a2a44" stroke="var(--accent2)" stroke-width="1.4"/>
      <polygon points="0,-14 3,4 0,2 -3,4" fill="#8bd4ff"/>
      <polygon class="flame" points="-4,10 4,10 0,20" fill="#ffb347"/>
    </svg>
  </div>

  <div class="corner-btn" id="btn-menu">☰</div>
  <div class="corner-btn" id="btn-galaxy">⬡</div>

  <div class="steer left" id="steer-left"><span class="steer-arrow">◀</span><span class="steer-label" id="steer-left-label">ЛЕВО</span></div>
  <div class="steer right" id="steer-right"><span class="steer-arrow">▶</span><span class="steer-label" id="steer-right-label">ПРАВО</span></div>

  <div class="bottom-row">
    <div id="object-list">
      <div class="ol-rows" id="ol-rows"></div>
    </div>

    <div id="three-menu">
      <div class="tm-strip" id="tm-up">▲</div>
      <div class="tm-setname" id="tm-setname">БОЙ</div>
      <div class="tm-buttons" id="tm-buttons"></div>
      <div class="tm-strip" id="tm-down">▼</div>
    </div>

    <div id="radar-wrap">
      <div id="radar-fly-btn">ЛЕТЕТЬ</div>
      <svg viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="58" fill="none" stroke="var(--border)" stroke-width="1"/>
        <circle cx="60" cy="60" r="38" fill="none" stroke="var(--border)" stroke-width="1"/>
        <circle cx="60" cy="60" r="18" fill="none" stroke="var(--border)" stroke-width="1"/>
        <g class="radar-sweep">
          <line x1="60" y1="60" x2="60" y2="2" stroke="var(--accent2)" stroke-width="1" opacity="0.5"/>
        </g>
        <circle cx="60" cy="60" r="2.5" fill="var(--accent2)"/>
        <g id="radar-blips"></g>
      </svg>
      <div id="radar-label">РАДАР</div>
    </div>
  </div>

  <div id="toast"></div>

  <div id="modal">
    <div id="modal-box">
      <div id="modal-title">—</div>
      <div id="modal-body">—</div>
      <div id="modal-close">ЗАКРЫТЬ</div>
    </div>
  </div>

</div>

<script src="world.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════════════
// HUD КОРАБЛЯ — тот же мир, что и на карте системы, но в масштабе 1:1.
//
// Данные, часы, положения тел и действия корабля берутся из общего модуля
// world.js: реальность одна, и считать её в каждом экране заново нельзя —
// разъедутся радар, карта и навигация. Экран отвечает только за отрисовку
// и органы управления.
//
// Масштаб: 1 клеть = ширина экрана телефона (ТЗ.md §2.7.4, SCALE в world.js).
// Это самый близкий масштаб в игре и единственный для этого экрана: игрок
// «внутри» мира, а не смотрит на схему сверху.
// ══════════════════════════════════════════════════════════════════════════
const { FACTIONS, PLANET_TYPES, SCALE } = World;

let shipView = null;
let currentStar = null;

// Выбранная цель навигации: {kind:'star'|'planet', index}. index=-1 для звезды
// (для единообразия с server API, где planetIndex у kind:"star" не читается).
let selectedTarget = null;
let lastStarId = null;
function isSameTarget(a, b){ return !!a && !!b && a.kind === b.kind && a.index === b.index; }

const gameMonths = World.gameMonths;
const planetLocal = World.planetPos;

function onWorld(w){
  shipView = w.online ? w.ship : null;
  // Корабль на поверхности — обычно сразу на planet.html, но пока
  // landingInProgress (клик «ПОСАДКА» ниже, ещё идёт animateLanding прямо
  // тут) — не перехватываем: World.land() уведомляет подписчиков ДО того,
  // как код после await успевает начать анимацию, иначе она не успевала бы
  // проиграться ни разу — редирект случался бы раньше первого кадра.
  if(shipView && shipView.landed && !landingInProgress){ location.href = 'planet.html'; return; }
  // в межзвёздном перелёте вокруг буквально пустота — ни системы, ни целей
  currentStar = (w.online && !(w.ship.transit && w.ship.transit.mode === 'interstellar'))
    ? w.star : null;
  const starId = currentStar ? currentStar.id : null;
  if(starId !== lastStarId){
    selectedTarget = null; // цель принадлежала прошлой системе — тут её объектов нет
    lastStarId = starId;
  }
  // Цель не выбрана вручную (свежий заход на экран — например, редирект
  // сюда с карты системы/сектора сразу после прокладки курса) — подхватываем
  // её из состояния корабля: летит куда-то или уже стоит у планеты. Без
  // этого «ПОСАДКА» не появлялась бы сама по прибытии, требуя повторного
  // клика по цели в списке (прилёт на планету не меняет starId, поэтому
  // сброс выше тут не помогает).
  if(!selectedTarget && shipView){
    if(shipView.transit && shipView.transit.mode === 'system'){
      selectedTarget = { kind: shipView.transit.targetKind, index: shipView.transit.targetPlanetIndex };
    } else if(shipView.atPlanetIndex >= 0){
      selectedTarget = { kind:'planet', index: shipView.atPlanetIndex };
    }
  }
  renderObjectList();
  renderRadarBlips();
  renderWorldLayer();
  updateFlyUI();
}

// bearing: 0°=вверх экрана (курс корабля), по часовой — та же конвенция,
// что уже была в радаре-заглушке (x=r·sin, y=-r·cos)
function bearing(dx, dy){ return Math.atan2(dx, dy) * 180 / Math.PI; }

// Положение корабля — World.shipPos(): стоя у планеты, корабль НАСЛЕДУЕТ её
// орбитальное движение, а не берётся из снимка /api/ship раз в секунду.
// Иначе дистанция до «своей» планеты дёргалась бы вместо честного нуля.
const shipLocal = World.shipPos;

function computeNearby(){
  if(!currentStar || !shipView) return [];
  const me = shipLocal();
  const list = [];
  list.push({
    kind:'star', index:-1,
    name: World.starLabel(currentStar), dist: Math.hypot(me.x, me.y), color: World.starColor(currentStar),
    angle: bearing(-me.x, -me.y),
  });
  const now = gameMonths();
  (currentStar.planets||[]).forEach((p,i)=>{
    const loc = planetLocal(p, now); // планета на орбите движется
    const t = PLANET_TYPES[p.type] || {name:p.type, color:'#888'};
    list.push({
      kind:'planet', index:i,
      name: `${t.name} · орб.${p.orbit}`, dist: Math.hypot(loc.x-me.x, loc.y-me.y), color: t.color,
      angle: bearing(loc.x-me.x, loc.y-me.y),
    });
  });
  list.sort((a,b)=>a.dist-b.dist);
  return list;
}

// ── выбор цели навигации: из списка объектов или прямо с радара ─────────────
function selectTarget(o){
  selectedTarget = { kind:o.kind, index:o.index };
  renderObjectList();
  renderRadarBlips();
  updateFlyUI();
}

const OL_COLLAPSED_COUNT = 5; // сколько ближайших объектов показываем без разворота панели

function renderObjectList(){
  const wrap = document.getElementById('ol-rows');
  wrap.innerHTML = '';
  const nearby = computeNearby();
  const expanded = document.getElementById('object-list').classList.contains('expanded');
  const list = expanded ? nearby : nearby.slice(0, OL_COLLAPSED_COUNT);
  if(list.length === 0){
    const row = document.createElement('div');
    row.className = 'ol-row';
    row.innerHTML = `<span class="ol-name" style="opacity:.5">${shipView && shipView.transit ? 'открытый космос…' : 'нет связи с сервером'}</span>`;
    wrap.appendChild(row);
    return;
  }
  list.forEach(o=>{
    const row = document.createElement('div');
    row.className = 'ol-row' + (isSameTarget(selectedTarget, o) ? ' ol-row-selected' : '');
    row.innerHTML = `<span class="ol-dot" style="background:${o.color}"></span>
      <span class="ol-name">${o.name}</span><span class="ol-dist">${o.dist.toFixed(1)}кл</span>`;
    // stopPropagation — иначе клик по конкретному объекту всплывёт до
    // #object-list и просто развернёт/свернёт панель вместо выбора цели
    row.onclick = (e) => { e.stopPropagation(); selectTarget(o); };
    wrap.appendChild(row);
  });
}

function renderRadarBlips(){
  const g = document.getElementById('radar-blips');
  g.innerHTML = '';
  const nearby = computeNearby();
  const maxDist = (currentStar && currentStar.sysR) ? currentStar.sysR : 60;

  // позиции считаем все разом — маршрут до цели рисуется ПОД блипами (нужен
  // порядок в DOM: линия первым узлом)
  const positioned = nearby.map(o=>{
    const r = 8 + Math.min(1, o.dist / maxDist) * 48;
    const rad = o.angle * Math.PI / 180;
    return { o, x: 60 + r * Math.sin(rad), y: 60 - r * Math.cos(rad) };
  });

  const targetHit = positioned.find(p => isSameTarget(selectedTarget, p.o));
  if(targetHit){
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', 60); line.setAttribute('y1', 60);
    line.setAttribute('x2', targetHit.x); line.setAttribute('y2', targetHit.y);
    line.setAttribute('class', 'radar-route');
    g.appendChild(line);
  }

  positioned.forEach(({o,x,y})=>{
    const isSel = isSameTarget(selectedTarget, o);
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', isSel ? 4 : 3);
    c.setAttribute('fill', o.color);
    c.setAttribute('class', 'radar-blip' + (isSel ? ' radar-blip-selected' : ''));
    // stopPropagation — иначе клик по блипу всплывёт до #radar-wrap и откроет
    // экран карты вместо выбора цели
    c.addEventListener('click', (e) => { e.stopPropagation(); selectTarget(o); });
    g.appendChild(c);
  });
}

// ── кнопка над радаром: «ЛЕТЕТЬ» к выбранной цели, а у уже достигнутой
// планеты — «ПОСАДКА» вместо простого исчезновения (было упущено при
// добавлении экрана «Планета»: кнопка тут пряталась молча). Газовые
// гиганты твёрдой поверхности не имеют — как и на карте системы, кнопка
// для них не показывается вовсе.
let flyBtnMode = 'fly'; // 'fly' | 'land'
function updateFlyUI(){
  const btn = document.getElementById('radar-fly-btn');
  if(!selectedTarget || !currentStar || !shipView){ btn.classList.remove('show'); return; }
  const alreadyThere = !shipView.transit && shipView.systemStarId === currentStar.id &&
    selectedTarget.kind === 'planet' && shipView.atPlanetIndex === selectedTarget.index;
  if(alreadyThere){
    if(shipView.landed){ btn.classList.remove('show'); return; } // уже сел — сейчас перекинет на planet.html
    const p = currentStar.planets && currentStar.planets[selectedTarget.index];
    if(p && p.type === 'gas'){ btn.classList.remove('show'); return; }
    flyBtnMode = 'land';
    btn.textContent = 'ПОСАДКА';
    btn.classList.add('show');
    return;
  }
  flyBtnMode = 'fly';
  btn.textContent = 'ЛЕТЕТЬ';
  btn.classList.add('show');
}
// Пока идёт посадка (после ответа сервера, до конца анимации) — не даём
// onWorld() перехватить и увести сразу на planet.html: анимация должна
// проиграть один раз целиком, а не быть пропущена гонкой опроса.
let landingInProgress = false;
document.getElementById('radar-fly-btn').addEventListener('click', async (e) => {
  e.stopPropagation(); // не давать клику всплыть до #radar-wrap (открыл бы карту)
  if(!selectedTarget || !currentStar) return;
  if(flyBtnMode === 'land'){
    landingInProgress = true;
    try{
      await World.land();
      animateLanding(); // прямо здесь, на HUD корабля — см. §2.1.3 ТЗ_UI.md
    }catch(err){ landingInProgress = false; toast('Не удалось сесть: ' + err.message); }
    return;
  }
  try{
    const data = await World.navigate(selectedTarget.kind, currentStar.id,
      selectedTarget.kind === 'planet' ? selectedTarget.index : 0);
    toast(data.transit ? 'Курс проложен' : 'Вы уже там');
    updateFlyUI();
  }catch(err){ toast('Не удалось проложить курс: ' + err.message); }
});

// ══════════════════════════════════════════════════════════════════════════
// АНИМАЦИЯ ПОСАДКИ — прямо на HUD корабля, не на карте системы: сервер уже
// авторитетно посадил корабль (Landed=true), это только визуальный переход
// к экрану «Планета». Мир здесь рисуется в масштабе 1:1 без свободной
// камеры (пространство вращается вокруг неподвижного корабля, §2.1.2) — «лететь
// к центру планеты» тут не воспроизвести буквально, поэтому вместо
// перемещения корабль на месте уменьшается и тает, а мир вокруг слегка
// приближается — тот же смысл («корабль уменьшается, проваливаясь в
// посадку»), в системе координат этого экрана.
// ══════════════════════════════════════════════════════════════════════════
const LANDING_ANIM_MS = 4200;
function animateLanding(){
  // #space анимирует transform через CSS-transition .25s (для плавных
  // манёвров, applySpaceRotation) — на покадровое обновление зума эта
  // transition наложилась бы каждый кадр и дала вязкое отставание вместо
  // плавного приближения. На время посадки — прямое обновление без нее.
  spaceEl.style.transition = 'none';
  const t0 = performance.now();
  function step(now){
    const frac = Math.min(1, (now - t0) / LANDING_ANIM_MS);
    const ease = frac * frac * (3 - 2 * frac); // smoothstep — плавные разгон/торможение
    const shipScale = Math.max(0.0001, 1 - ease);
    shipWrap.style.transform = `translate(-50%,-50%) scale(${shipScale})`;
    shipWrap.style.opacity = String(1 - ease * 0.9);
    spaceZoom = 1 + ease * 0.18; // лёгкое приближение мира — ощущение погружения
    applySpaceRotation();
    if(frac < 1){
      requestAnimationFrame(step);
    } else {
      location.href = 'planet.html';
    }
  }
  requestAnimationFrame(step);
}

// ══════════════════════════════════════════════════════════════════════════
// СЛОЙ МИРА В МАСШТАБЕ 1:1
//
// Тот же мир, что рисует карта системы, но вплотную: 1 клеть = ширина экрана
// (SCALE.shipCellsPerScreen, ТЗ.md §2.7.4). Тела рисуются ИСТИННЫМ размером,
// без подгонки — самая крупная планета в игре (⌀1 клеть) занимает ровно экран
// целиком, остальные меньше.
//
// Координаты: корабль в начале, ось Y экрана — вперёд по курсу. viewBox взят
// в клетях, поэтому радиусы тел подставляются как есть, без пересчёта.
// Слой лежит внутри #space и потому вращается вместе с ним при смене курса.
// ══════════════════════════════════════════════════════════════════════════
const worldLayer = document.getElementById('world-layer');
const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs){
  const e = document.createElementNS(SVGNS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function renderWorldLayer(){
  worldLayer.innerHTML = '';
  if(!currentStar || !shipView) return;

  // Ширина обзора = 1 клеть; #space растянут на 180% экрана (inset:-40%),
  // поэтому по ширине слоя укладывается 1.8 клети — так при повороте
  // пространства углы кадра не оказываются пустыми.
  const viewCells = SCALE.shipCellsPerScreen * 1.8;
  const half = viewCells / 2;
  worldLayer.setAttribute('viewBox', `${-half} ${-half} ${viewCells} ${viewCells}`);

  const me = shipLocal();
  const t = gameMonths();

  // экранные координаты относительно корабля; ось Y вниз, поэтому инверсия
  const rel = (x, y) => ({ x: x - me.x, y: -(y - me.y) });

  // звезда
  const s = rel(0, 0);
  worldLayer.appendChild(svgEl('circle', {
    class:'w-star', cx:s.x, cy:s.y, r:2,   // радиус звезды 2 клети, ТЗ.md §2.8
    fill: World.starColor(currentStar), stroke: World.starColor(currentStar),
  }));

  // планеты — в истинном размере: половина диаметра в клетях
  (currentStar.planets || []).forEach(p => {
    const loc = planetLocal(p, t);
    const c = rel(loc.x, loc.y);
    // за пределами обзора с запасом — не рисуем вовсе
    if(Math.hypot(c.x, c.y) - (p.d||2)/2 > viewCells) return;
    worldLayer.appendChild(svgEl('circle', {
      class:'w-planet', cx:c.x, cy:c.y, r:(p.d||2)/2, fill: World.planetColor(p),
    }));
  });
}

// ── звёздный фон-заглушка ────────────────────────────────────────────────
(function drawStarfield(){
  const canvas = document.getElementById('space-canvas');
  const ctx = canvas.getContext('2d');
  function resize(){
    canvas.width = canvas.clientWidth * devicePixelRatio;
    canvas.height = canvas.clientHeight * devicePixelRatio;
  }
  resize();
  window.addEventListener('resize', resize);
  const stars = Array.from({length:120}, () => ({
    x: Math.random(), y: Math.random(), r: Math.random()*1.4+0.3, a: Math.random()*0.6+0.2
  }));
  function draw(){
    ctx.fillStyle = '#04060f';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    stars.forEach(s=>{
      ctx.globalAlpha = s.a;
      ctx.fillStyle = '#cce4ff';
      ctx.beginPath();
      ctx.arc(s.x*canvas.width, s.y*canvas.height, s.r*devicePixelRatio, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  draw();
})();

// ── тост ──────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

// ── модалка ──────────────────────────────────────────────────────────────
function openModal(title, body){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').textContent = body;
  document.getElementById('modal').classList.add('open');
}
document.getElementById('modal-close').onclick = ()=>document.getElementById('modal').classList.remove('open');
document.getElementById('modal').onclick = (e)=>{ if(e.target.id==='modal') e.currentTarget.classList.remove('open'); };

// ── верхние кнопки ───────────────────────────────────────────────────────
document.getElementById('btn-menu').onclick = ()=>openModal('МЕНЮ', 'Заглушка: выход в главное меню.');
// Карта звёздной системы или сектора — в зависимости от того, где сейчас
// корабль (ТЗ_UI.md §2.3): в межзвёздном перелёте показывать нечего кроме
// самого сектора, иначе — система, в которой корабль находится сейчас.
function openMapForShipLocation(){
  if(shipView && shipView.landed){ location.href = 'planet.html'; return; }
  location.href = (shipView && shipView.transit && shipView.transit.mode === 'interstellar') ? 'galaxy.html' : 'system.html';
}
document.getElementById('btn-galaxy').onclick = openMapForShipLocation;

// ── радар и список объектов ─────────────────────────────────────────────
document.getElementById('radar-wrap').onclick = openMapForShipLocation;
// Клик по списку объектов раскрывает панель вверх (до зоны меню), а не открывает модалку —
// показывает все видимые объекты, а не только 4 ближайших.
document.getElementById('object-list').onclick = ()=>{
  document.getElementById('object-list').classList.toggle('expanded');
  renderObjectList();
};

// ── меню трёх кнопок ─────────────────────────────────────────────────────
const shipWrap = document.getElementById('ship-wrap');
const SETS = [
  { name:'БОЙ', buttons:[
      { label:'Тактика\n1', kind:'radio', act:()=>toast('Тактика захода №1 — ведомые синхронны') },
      { label:'Тактика\n2', kind:'radio', act:()=>toast('Тактика захода №2 — ведомые синхронны') },
      { label:'Тактика\n3', kind:'radio', act:()=>toast('Тактика захода №3 — ведомые синхронны') },
    ]},
  { name:'ПОЛЁТ', buttons:[
      { label:'Паруса', kind:'toggle', act:(on)=>{ shipWrap.classList.toggle('sails', on); toast(on?'Паруса развёрнуты':'Паруса свёрнуты'); } },
      { label:'Форсаж', kind:'toggle', act:(on)=>{ shipWrap.classList.toggle('boost', on); toast(on?'Форсаж включён':'Форсаж выключен'); } },
      { label:'Тормож.', kind:'toggle', act:(on)=>{ shipWrap.classList.toggle('brake', on); toast(on?'Торможение':'Торможение отключено'); } },
    ]},
  { name:'ДЕЙСТВИЯ', buttons:[
      { label:'Осмотр\nкорабля', kind:'momentary', act:()=>openModal('ОСМОТР КОРАБЛЯ', 'Заглушка: выберите свой корабль или брошенный на экране, чтобы увидеть характеристики/груз/модули.') },
      { label:'SOS', kind:'momentary', act:()=>toast('Сигнал SOS отправлен (заглушка)') },
      { label:'Сброс\nгруза', kind:'momentary', act:()=>toast('Груз выброшен из трюма (заглушка)') },
    ]},
];
let setIndex = 0;

function renderSet(){
  const set = SETS[setIndex];
  document.getElementById('tm-setname').textContent = set.name;
  const wrap = document.getElementById('tm-buttons');
  wrap.innerHTML = '';
  set.buttons.forEach(b=>{
    const el = document.createElement('div');
    el.className = 'tm-btn';
    el.style.whiteSpace = 'pre-line';
    el.textContent = b.label;
    el.onclick = ()=>{
      if(b.kind === 'toggle'){
        const on = !el.classList.contains('active');
        el.classList.toggle('active', on);
        b.act(on);
      } else if(b.kind === 'radio'){
        wrap.querySelectorAll('.tm-btn').forEach(x=>x.classList.remove('active'));
        el.classList.add('active');
        b.act();
      } else {
        b.act();
      }
    };
    wrap.appendChild(el);
  });
  updateSteerLabels();
}
document.getElementById('tm-up').onclick = ()=>{ setIndex = (setIndex+1) % SETS.length; renderSet(); };
document.getElementById('tm-down').onclick = ()=>{ setIndex = (setIndex+SETS.length-1) % SETS.length; renderSet(); };

// ── боковые манёвренные регуляторы ──────────────────────────────────────
// В режиме «БОЙ» — угол поворота корабля относительно цели.
// В остальных режимах («ПОЛЁТ»/«ДЕЙСТВИЯ») — манёвр вправо/влево для уворота от астероидов/обломков.
function updateSteerLabels(){
  const inCombat = SETS[setIndex].name === 'БОЙ';
  document.getElementById('steer-left-label').textContent = inCombat ? 'ПОВОРОТ' : 'МАНЁВР';
  document.getElementById('steer-right-label').textContent = inCombat ? 'ПОВОРОТ' : 'МАНЁВР';
}

// Корабль всегда смотрит «вперёд» (вверх экрана) и не вращается.
// При смене курса вращается пространство вокруг корабля — поворот вправо
// разворачивает мир против часовой стрелки (то, что было впереди, уходит влево), и наоборот.
const spaceEl = document.getElementById('space');
let spaceAngle = 0;
let spaceZoom = 1; // 1 обычно, растёт только во время анимации посадки (animateLanding)
function applySpaceRotation(){ spaceEl.style.transform = `rotate(${spaceAngle}deg) scale(${spaceZoom})`; }

function wireSteer(el, dir){
  const sign = dir === 'left' ? 1 : -1; // left → мир вращается по часовой, right → против часовой
  let turnTimer = null;
  const start = ()=>{
    el.classList.add('active');
    const inCombat = SETS[setIndex].name === 'БОЙ';
    toast(inCombat
      ? `Поворот ${dir==='left'?'влево':'вправо'} — прицеливание по цели`
      : `Манёвр ${dir==='left'?'влево':'вправо'} — уворот от препятствия`);
    turnTimer = setInterval(()=>{ spaceAngle += sign*3; applySpaceRotation(); }, 60);
  };
  const end = ()=>{
    el.classList.remove('active');
    clearInterval(turnTimer);
  };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointerleave', end);
  el.addEventListener('pointercancel', end);
}
wireSteer(document.getElementById('steer-left'), 'left');
wireSteer(document.getElementById('steer-right'), 'right');

renderSet();

// ── подписка на общий мир ────────────────────────────────────────────────
World.subscribe(onWorld);
World.start();

// Радар и слой мира — покадрово: планеты движутся по орбитам, и корабль
// вместе со «своей» планетой. Раз в секунду, как приходят данные, они бы
// дёргались. Список объектов, наоборот, обновляется по опросу: числа
// дистанций, скачущие 60 раз в секунду, читать невозможно.
(function frame(){
  renderRadarBlips();
  renderWorldLayer();
  requestAnimationFrame(frame);
})();
</script>
