<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>УРОБОРОС — Карта сектора</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap');
  :root {
    --bg:#04060f; --panel-bg:rgba(6,12,28,0.92); --border:rgba(60,130,200,0.18);
    --accent:#2a7fff; --accent2:#00e5ff; --text:#8baac8; --text-bright:#cce4ff;
    --mono:'Share Tech Mono',monospace; --sans:'Rajdhani',sans-serif;
    --gold:#ffcf6b;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{height:100%;background:#000;}
  body{font-family:var(--sans);color:var(--text);display:flex;align-items:center;justify-content:center;}

  #screen{position:relative;flex-shrink:0;
    width:min(92vw, 400px, calc(94vh * 390 / 844));
    aspect-ratio:390/844;
    background:var(--bg);overflow:hidden;
    border-radius:34px;border:2px solid #14161e;
    box-shadow:0 0 0 1px rgba(255,255,255,0.03), 0 20px 60px rgba(0,0,0,0.7);
    display:flex;flex-direction:column;}

  /* Админ-панель (скорость, статистика сектора, ссылка на список планет) —
     не часть этой страницы: подключается скриптом admin-panel.js, который
     сам вставляет разметку/стили и подстраивает body под второй элемент
     рядом с рамкой телефона. См. ТЗ_UI.md §1.1. */

  /* ── шапка: строка МЕНЮ / название / своего сектора ────────────────── */
  header{flex-shrink:0;height:32px;display:flex;align-items:center;justify-content:space-between;
    padding:0 10px;border-bottom:1px solid var(--border);z-index:10;line-height:1.3;}
  #btn-back{font-family:var(--mono);font-size:7px;letter-spacing:1px;color:var(--accent2);cursor:pointer;}
  #hdr-title{font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--accent2);}
  #btn-own-sector{font-family:var(--mono);font-size:6.5px;letter-spacing:.5px;color:var(--text);opacity:.7;cursor:pointer;text-align:right;}

  /* ── верхняя строка из 3 панелей: список / выбранный объект / миникарта ── */
  #top-row{flex-shrink:0;display:flex;gap:4px;padding:5px 6px;border-bottom:1px solid var(--border);z-index:10;}
  #top-row > div{background:var(--panel-bg);border:1px solid var(--border);padding:5px 6px;overflow:hidden;}
  #tr-objects{flex:1.1;position:relative;padding-left:10px !important;}
  #tr-slider{position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--border);}
  #tr-slider::after{content:'';position:absolute;left:-1.5px;top:0;width:4px;height:10px;background:var(--accent2);}
  #tr-objects .tr-title{font-family:var(--mono);font-size:6px;letter-spacing:1px;color:var(--accent);opacity:.8;margin-bottom:3px;}
  .tr-obj-row{font-family:var(--mono);font-size:6.5px;color:var(--text-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 0;}
  #tr-selected{flex:1.4;}
  #tr-selected .tr-title{font-family:var(--sans);font-weight:600;font-size:9px;color:var(--text-bright);margin-bottom:3px;}
  #tr-selected-rows{font-family:var(--mono);font-size:6.3px;color:var(--text);line-height:1.65;}
  #tr-selected-rows b{color:var(--accent2);font-weight:400;}
  #tr-minimap{flex:0.8;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  #tr-minimap .tr-title{font-family:var(--mono);font-size:6px;letter-spacing:1px;color:var(--accent);opacity:.8;margin-bottom:3px;align-self:flex-start;}
  #tr-minimap-box{width:100%;aspect-ratio:1/1;border:1px solid var(--border);position:relative;background:rgba(0,229,255,0.04);}
  #tr-minimap-box::after{content:'';position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;
    background:var(--accent2);transform:translate(-50%,-50%);box-shadow:0 0 4px var(--accent2);}

  /* ── карта: квадратное окно, по центру доступного места ─────────────── */
  #map-outer{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px;min-height:0;}
  #map-wrap{position:relative;width:100%;aspect-ratio:1/1;max-height:100%;}
  #map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
  #map.panning{cursor:grabbing;}
  .zone-line{fill:none;stroke:var(--border);stroke-width:1;}
  .zone-line.stable{stroke:rgba(255,207,107,0.28);}
  .zone-num{font-family:var(--mono);font-size:7px;fill:var(--text);opacity:.5;}
  .zone-num.stable{fill:var(--gold);opacity:.8;}
  .assemble-ring{fill:none;stroke:var(--gold);stroke-width:2.2;stroke-dasharray:5 4;opacity:.85;pointer-events:none;}

  .obj{cursor:pointer;}
  .obj-star{stroke-width:0.6;}
  .obj-neb{mix-blend-mode:screen;}
  .obj-ast{opacity:.7;}
  .obj-bh-ring{fill:none;stroke-width:0.6;opacity:.35;}
  .obj-stable{filter:drop-shadow(0 0 4px currentColor);}
  .obj-neutron-core{fill:#ffffff;}
  .obj-selected{stroke:#fff !important;stroke-width:1.2 !important;}

  /* ── список планет выбранной звезды (внутри #tr-selected) ─────────────── */
  #tr-planets{margin-top:4px;border-top:1px solid var(--border);padding-top:4px;display:none;max-height:44px;overflow-y:auto;}
  .ip-row{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:6.3px;color:var(--text-bright);padding:1px 0;}
  .ip-type{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .ip-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ip-faction{width:6px;height:6px;flex-shrink:0;border-radius:1px;}

  /* ── списки флотов/колоний под картой ──────────────────────────────── */
  #side-lists{flex-shrink:0;display:flex;gap:4px;padding:4px 6px;z-index:10;}
  #side-lists > div{flex:1;background:var(--panel-bg);border:1px solid var(--border);padding:4px 6px;}
  #side-lists .sl-title{font-family:var(--mono);font-size:6px;letter-spacing:1px;color:var(--accent);opacity:.8;margin-bottom:2px;}
  .sl-row{font-family:var(--mono);font-size:6.5px;color:var(--text-bright);padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  .sl-row.active{color:var(--accent2);}

  /* ── нижняя панель: назад / статус флота / смена флота / лететь ───────── */
  #bottom-bar{flex-shrink:0;display:flex;align-items:stretch;gap:4px;padding:6px 8px;
    border-top:1px solid var(--border);background:var(--panel-bg);z-index:10;}
  #bb-back{width:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:rgba(255,60,60,0.12);border:1.5px solid #ff4d4d;color:#ff4d4d;font-size:14px;cursor:pointer;}
  #bb-prev,#bb-next{width:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    border:1.2px solid #ff4d4d;color:#ff4d4d;font-size:13px;cursor:pointer;background:rgba(255,60,60,0.06);}
  #bb-status{flex:1;border:1px solid var(--accent);padding:3px 6px;overflow:hidden;}
  #bb-status .bs-title{font-family:var(--mono);font-size:6px;letter-spacing:.5px;color:var(--accent);opacity:.85;}
  #bb-status .bs-name{font-family:var(--sans);font-weight:600;font-size:9px;color:var(--text-bright);}
  #bb-status .bs-sub{font-family:var(--mono);font-size:6px;color:var(--text);opacity:.75;}
  #bb-fly{width:42px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:rgba(60,255,140,0.12);border:1.5px solid #3cff8c;color:#3cff8c;font-size:16px;cursor:pointer;}
  #bb-back:active,#bb-fly:active,#bb-prev:active,#bb-next:active{filter:brightness(1.3);}

  /* ── тост ───────────────────────────────────────────────── */
  #toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%) translateY(10px);
    background:var(--panel-bg);border:1px solid var(--accent2);color:var(--accent2);
    font-family:var(--mono);font-size:9px;letter-spacing:.5px;padding:7px 12px;z-index:60;
    max-width:80%;text-align:center;line-height:1.5;white-space:pre-line;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ── плашка «нет связи с сервером» ────────────────────────── */
  #offline{position:absolute;inset:0;background:rgba(4,6,15,0.94);z-index:80;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;}
  #offline.show{display:flex;}
  #offline .off-title{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:#ff8060;}
  #offline .off-text{font-family:var(--mono);font-size:8px;color:var(--text);line-height:1.8;}
</style>
</head>
<body>
<div id="screen">

  <header>
    <div id="btn-back">☰ МЕНЮ</div>
    <div id="hdr-title">СЕКТОР ГАЛАКТИКИ</div>
    <div id="btn-own-sector">КАРТА СВОЕГО<br>СЕКТОРА</div>
  </header>

  <div id="top-row">
    <div id="tr-objects">
      <div id="tr-slider"></div>
      <div class="tr-title">ОБЪЕКТЫ СЕКТОРА</div>
      <div id="tr-obj-rows"></div>
    </div>
    <div id="tr-selected">
      <div class="tr-title" id="ts-name">—</div>
      <div id="tr-selected-rows">выберите объект на карте</div>
      <div id="tr-planets"></div>
    </div>
    <div id="tr-minimap">
      <div class="tr-title">МИНИКАРТА</div>
      <div id="tr-minimap-box"></div>
    </div>
  </div>

  <div id="map-outer">
    <div id="map-wrap">
      <svg id="map" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </div>

  <div id="side-lists">
    <div id="fleet-list-panel">
      <div class="sl-title">ФЛОТЫ</div>
      <div id="fleet-rows"></div>
    </div>
    <div id="colony-list-panel">
      <div class="sl-title">КОЛОНИИ</div>
      <div id="colony-rows"></div>
    </div>
  </div>

  <div id="bottom-bar">
    <div id="bb-back" title="Назад к кораблю">←</div>
    <div id="bb-prev">◀</div>
    <div id="bb-status">
      <div class="bs-title">ФЛОТ · КОМАНДНЫЙ КОРАБЛЬ</div>
      <div class="bs-name" id="bs-name">—</div>
      <div class="bs-sub" id="bs-sub">—</div>
    </div>
    <div id="bb-next">▶</div>
    <div id="bb-fly" title="Лететь к выделенному объекту">▶</div>
  </div>

  <div id="toast"></div>

  <div id="offline">
    <div class="off-title">НЕТ СВЯЗИ С СЕРВЕРОМ</div>
    <div class="off-text" id="off-text"></div>
  </div>

</div>

<script src="world.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════════════
// КЛИЕНТ: только отображение.
//
// Симуляция целиком на сервере (server/): он засевает галактику, ведёт единое
// игровое время и решает, кто покинул сектор и кто вошёл взамен. Клиент ничего
// не разыгрывает — иначе два телефона показали бы разные галактики.
//
// Позиции клиент считает сам, но не «накоплением по кадрам», а по формуле:
//   x(t) = x0 + arc · (t − t0)
// где x0/t0/arc приходят с сервера, а t — игровое время сервера. Поэтому
// картинка не зависит ни от частоты кадров, ни от того, сколько вкладка
// пробыла в фоне: вернувшись, она мгновенно оказывается там, где надо.
// ══════════════════════════════════════════════════════════════════════════

// ── геометрия окна (ТЗ.md §2.1) ───────────────────────────────────────────
const MAX_R = 120;      // радиальная ось окна (клети)
const HALF_W = 60;      // половина ширины окна по дуговой оси
const TRUE_R0 = 280;    // от истинного центра галактики до ближнего края окна
const PXPU = 300 / MAX_R;
const APEX_X = 150, APEX_Y = 300 + TRUE_R0*PXPU;
// Круг перелётов вписан в окно: центр — столица Империи в (r=60, x=60), то есть
// ровно середина сетки 120×120, радиус 60. Круг касается ближнего и дальнего
// рубежей и обеих боковых границ, поэтому вся радиальная ось достижима.
// Раньше стояло 50 при столице на r=65: круг покрывал r=15…115, был смещён
// вверх на 5 клетей, и зона 1 (хаос, чёрные дыры) оказывалась недостижимой.
// Вне круга остаются только четыре угла окна — для круга в квадрате это неизбежно.
const ASSEMBLE_R = 60;

function toXY(r, x){
  const trueR = TRUE_R0 + r;
  const theta = (x - HALF_W) / trueR;
  const truePx = trueR * PXPU;
  return { x: APEX_X + truePx * Math.sin(theta), y: APEX_Y - truePx * Math.cos(theta) };
}

// Справочники — из общего модуля world.js: реальность одна на все экраны,
// и держать по копии словарей в каждом файле нельзя (разъезжаются цвета и
// названия). Сектор при этом остаётся на своём канале данных — SSE-потоке
// событий, он для этого масштаба точнее опроса.
const { FACTIONS, PLANET_TYPES, RESOURCES, STAR_COLORS, STAR_NAMES } = World;

// ══════════════════════════════════════════════════════════════════════════
// ЕДИНОЕ ВРЕМЯ СЕРВЕРА
//
// Клиент не ведёт собственных часов. Он запоминает последнее известное
// серверное время и между синхронизациями лишь экстраполирует его по той же
// скорости. Поток событий приходит 4 раза в секунду, так что расхождение не
// успевает накопиться, а при смене скорости оно обнуляется сразу.
// ══════════════════════════════════════════════════════════════════════════
const clock = { months:0, speed:0, at:0, connected:false };
function syncClock(months, speed){
  clock.months = months;
  clock.speed = speed;
  clock.at = performance.now();
}
function gameMonths(){
  return clock.months + clock.speed * (performance.now() - clock.at)/1000;
}

// ── состояние сектора, полученное с сервера ───────────────────────────────
const objects = new Map(); // id -> объект
let centralWorld = null;   // столица Империи — центр круга перелётов
let lastSeq = 0;
let galaxySeed = 0;

// ══════════════════════════════════════════════════════════════════════════
// Рендер
// ══════════════════════════════════════════════════════════════════════════
const svg = document.getElementById('map');
const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs){
  const e = document.createElementNS(SVGNS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function drawDefs(){
  const defs = el('defs',{});
  const grad = el('radialGradient',{id:'nebGlow'});
  grad.appendChild(el('stop',{offset:'0%','stop-color':'rgb(68,255,204)','stop-opacity':'0.65'}));
  grad.appendChild(el('stop',{offset:'70%','stop-color':'rgb(68,255,204)','stop-opacity':'0.22'}));
  grad.appendChild(el('stop',{offset:'100%','stop-color':'rgb(68,255,204)','stop-opacity':'0'}));
  defs.appendChild(grad);
  const ringGrad = el('radialGradient',{id:'assembleFill'});
  ringGrad.appendChild(el('stop',{offset:'0%','stop-color':'#ffcf6b','stop-opacity':'0.10'}));
  ringGrad.appendChild(el('stop',{offset:'80%','stop-color':'#ffcf6b','stop-opacity':'0.05'}));
  ringGrad.appendChild(el('stop',{offset:'100%','stop-color':'#ffcf6b','stop-opacity':'0'}));
  defs.appendChild(ringGrad);
  svg.appendChild(defs);
}

function drawGrid(){
  // границы зон — пологие дуги (истинный центр далеко под окном), БЕЗ схождения в клин
  for(let k=0;k<=12;k++){
    const r = k*10;
    const p1 = toXY(r,0), pm = toXY(r,60), p2 = toXY(r,120);
    const rpx = (TRUE_R0 + r)*PXPU;
    const stable = k===5 || k===8; // границы стабильной полосы Империи
    svg.appendChild(el('path',{
      class:'zone-line'+(stable?' stable':''),
      d:`M ${p1.x},${p1.y} A ${rpx},${rpx} 0 0,1 ${pm.x},${pm.y} A ${rpx},${rpx} 0 0,1 ${p2.x},${p2.y}`
    }));
    if(k<12){
      const mid = toXY(k*10 + 5, 4);
      const zoneId = k+1;
      const zoneStable = zoneId>=6 && zoneId<=8;
      const t = el('text',{class:'zone-num'+(zoneStable?' stable':''), x:mid.x, y:mid.y, 'text-anchor':'start'});
      t.textContent = zoneId;
      svg.appendChild(t);
    }
  }
}

// круг перелётов — рисуется дважды: мягкая заливка ПОД объектами и чёткий
// контур ПОВЕРХ них (иначе тонкий пунктир теряется под картой)
function assembleCircleAttrs(){
  const c = toXY(centralWorld.r, centralWorld.x0);
  return { cx:c.x, cy:c.y, r:ASSEMBLE_R*PXPU };
}
let fillNode = null, ringNode = null, objLayer = null;
function drawAssembleLayers(){
  if(fillNode) fillNode.remove();
  if(ringNode) ringNode.remove();
  fillNode = el('circle',{ ...assembleCircleAttrs(), fill:'url(#assembleFill)', stroke:'none' });
  ringNode = el('circle',{ ...assembleCircleAttrs(), class:'assemble-ring' });
  svg.insertBefore(fillNode, objLayer); // заливка под объектами
  svg.appendChild(ringNode);            // контур поверх объектов
}

// ══════════════════════════════════════════════════════════════════════════
// РАЗМЕР ТОЧЕЧНЫХ ТЕЛ ЗАВИСИТ ОТ ЗУМА
//
// На общем плане звезда в свой истинный размер — это меньше половины пикселя:
// её не видно и в неё не попасть пальцем. Поэтому на общем плане тела рисуются
// заведомо крупнее реального, а по мере приближения сжимаются к истинному
// размеру — 1 клеть в поперечнике у звезды.
//
// Считаем так: экранный радиус не может быть меньше MIN_TAP_PX (иначе объект
// не выбрать на телефоне), но и не меньше истинного размера. Отсюда
// radius = max(истинный, MIN_TAP_PX × vb.w / ширина_элемента): при отдалении
// работает нижняя граница по пальцу, при приближении — истинный размер, и
// объект перестаёт раздуваться вместе с картой.
//
// Туманности и астероидные поля не масштабируются: их клочки уже нарисованы в
// истинных размерах по площади из ТЗ.md §2.11, и то, что туманность закрывает
// собой звёзды и соседние облака, — нормально.
// ══════════════════════════════════════════════════════════════════════════
const MIN_TAP_PX = 3.5; // минимальный экранный радиус тела, px
const BODY = {
  star:   { real: 0.50, emph: 1.00 },
  stable: { real: 0.65, emph: 1.35 }, // столицы и феоды выделяем крупнее
  bh:     { real: 0.50, emph: 0.90 },
};
function bodyRadius(o){
  const b = o.stable ? BODY.stable : (o.type==='bh' ? BODY.bh : BODY.star);
  const real = b.real * PXPU; // истинный размер в единицах viewBox
  const w = svg.getBoundingClientRect().width;
  if(!w) return real;
  return Math.max(real, MIN_TAP_PX * b.emph * vb.w / w);
}

// Пересчёт размеров всех точечных тел — вызывается при каждом изменении зума.
function applyBodySizes(){
  objects.forEach(o=>{
    if(!o._sized) return;
    const rr = bodyRadius(o);
    o._sized.forEach(([node, factor])=>node.setAttribute('r', rr*factor));
  });
}

function renderObject(o){
  if(o._node) o._node.remove(); // страховка: не оставлять прежний узел сиротой в SVG
  const p = toXY(o.r, xOf(o));
  let node;
  if(o.type==='star'){
    const g = el('g',{class:'obj', 'data-id':o.id});
    const rr = bodyRadius(o);
    const color = o.stable ? FACTIONS[o.faction].color : STAR_COLORS[o.starType];
    const body = el('circle',{
      class:'obj-star'+(o.stable?' obj-stable':''),
      cx:p.x, cy:p.y, r:rr, fill:color, stroke: o.stable?'#fff':color, style:o.stable?`color:${color}`:'',
    });
    g.appendChild(body);
    // _sized: узлы, чей радиус пересчитывается при зуме, и их доля от радиуса тела
    o._sized = [[body, 1]];
    if(o.starType==='neutron' && !o.stable){
      const core = el('circle',{class:'obj-neutron-core', cx:p.x, cy:p.y, r:rr*0.35});
      g.appendChild(core);
      o._sized.push([core, 0.35]);
    }
    if(o.stable){
      const halo = el('circle',{class:'obj-bh-ring', cx:p.x, cy:p.y, r:rr*2.4, stroke:color});
      g.appendChild(halo);
      o._sized.push([halo, 2.4]);
    }
    node = g;
  } else if(o.type==='bh'){
    const g = el('g',{class:'obj', 'data-id':o.id});
    const rr = bodyRadius(o);
    const body = el('circle',{cx:p.x, cy:p.y, r:rr, fill:'rgb(187,68,255)'});
    const disk = el('circle',{class:'obj-bh-ring', cx:p.x, cy:p.y, r:rr*2.25, stroke:'rgb(187,68,255)'});
    g.appendChild(body); g.appendChild(disk);
    o._sized = [[body, 1], [disk, 2.25]];
    node = g;
  } else {
    const isNeb = o.type==='neb';
    const g = el('g',{class:'obj '+(isNeb?'obj-neb':'obj-ast'), 'data-id':o.id});
    (o.puffs||[]).forEach(pf=>{
      g.appendChild(el('circle',{
        cx:p.x+pf.dx*PXPU, cy:p.y+pf.dy*PXPU, r:pf.r*PXPU,
        fill: isNeb ? 'url(#nebGlow)' : 'rgb(136,153,170)',
      }));
    });
    node = g;
  }
  o._node = node;
  objLayer.appendChild(node);
}

// t передаётся снаружи: игровое время считается один раз на кадр, а не 500 раз
function updateObjectPos(o, t){
  const p = toXY(o.r, xOf(o, t));
  const circles = o._node.querySelectorAll('circle');
  if(o.type==='neb' || o.type==='ast'){
    o.puffs.forEach((pf,i)=>{
      circles[i].setAttribute('cx', p.x+pf.dx*PXPU);
      circles[i].setAttribute('cy', p.y+pf.dy*PXPU);
    });
  } else {
    circles.forEach(c=>{ c.setAttribute('cx',p.x); c.setAttribute('cy',p.y); });
  }
}

// положение по дуге на текущее игровое время — чистая функция, без накопления
function xOf(o, t){ return o.x0 + o.arc * ((t===undefined ? gameMonths() : t) - o.t0); }

function removeObjectById(id){
  const o = objects.get(id);
  if(!o) return;
  if(o._node) o._node.remove();
  objects.delete(id);
  if(selectedObject === o) clearSelection();
}

function addObject(o){
  // Тот же ID уже может быть в карте: после resync сервер сдвигает курсор
  // событий на один момент, а снимок клиент забирает чуть позже, поэтому
  // события из этого промежутка приходят на объекты, уже вошедшие в снимок.
  // Без снятия прежнего узла он остаётся в SVG сиротой.
  const prev = objects.get(o.id);
  if(prev){
    if(prev._node) prev._node.remove();
    if(selectedObject === prev) clearSelection();
  }
  objects.set(o.id, o);
  renderObject(o);
}

// ══════════════════════════════════════════════════════════════════════════
// Связь с сервером
// ══════════════════════════════════════════════════════════════════════════
function showOffline(msg){
  clock.connected = false;
  document.getElementById('off-text').innerHTML = msg;
  document.getElementById('offline').classList.add('show');
}
function hideOffline(){
  clock.connected = true;
  document.getElementById('offline').classList.remove('show');
}

// Загрузка идёт строго по одной. На сильном ускорении сервер шлёт resync
// каждый кадр, и без этого замка несколько loadGalaxy выполнялись бы внахлёст:
// один успевал очистить карту до того, как другой её отрисовал, и в SVG
// оставались осиротевшие узлы (объектов 504, узлов 528).
let loadInFlight = false;
async function loadGalaxy(){
  if(loadInFlight) return;
  loadInFlight = true;
  try {
    await loadGalaxyInner();
  } finally {
    loadInFlight = false;
  }
}

async function loadGalaxyInner(){
  const res = await fetch('api/galaxy', {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();

  objects.forEach(o=>{ if(o._node) o._node.remove(); });
  objects.clear();
  clearSelection();

  galaxySeed = data.seed;
  lastSeq = data.seq;
  syncClock(data.months, data.speed);

  data.objects.forEach(o=>objects.set(o.id, o));
  centralWorld = data.objects.find(o=>o.role==='capital') || data.objects.find(o=>o.stable);
  objects.forEach(renderObject);
  applyBodySizes(); // при первом рендере ширина элемента могла быть ещё неизвестна
  drawAssembleLayers();
  renderStableList();
  hideOffline();
}

// смена ориентации/размера окна меняет масштаб — пересчитываем тела
window.addEventListener('resize', applyBodySizes);

let es = null, reconnectTimer = null;
function connectEvents(){
  if(es){ es.close(); es = null; }
  es = new EventSource('api/events?since='+lastSeq);
  es.onmessage = (ev)=>{
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    syncClock(msg.months, msg.speed);
    hideOffline();

    if(msg.resync){
      // клиент отстал больше, чем сервер хранит в буфере событий (бывает на
      // сильном ускорении) — дешевле перезабрать состав целиком
      lastSeq = msg.seq;
      loadGalaxy().catch(()=>{});
    } else if(msg.events && msg.events.length){
      msg.events.forEach(e=>{
        if(e.kind==='despawn') removeObjectById(e.id);
        else if(e.kind==='spawn') addObject(e.obj);
      });
      lastSeq = msg.seq;
    }
  };
  es.onerror = ()=>{
    // EventSource переподключается сам, но со старым since — пересоздаём вручную
    if(es){ es.close(); es = null; }
    showOffline('Сервер не отвечает.<br>Проверьте, что он запущен<br>(server/ouroboros-server.exe)');
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connectEvents, 2000);
  };
}

// Управление скоростью, статистика сектора и ссылка на список планет —
// в общей админ-панели (admin-panel.js), которая опрашивает /api/stats сама
// и не зависит от состояния этой страницы.

// ── тост ──────────────────────────────────────────────────────────────
let toastTimer;

  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);

// ── панель информации об объекте ────────────────────────────────────────
let selectedNode = null;
function selectVisual(node){
  if(selectedNode) selectedNode.querySelectorAll('circle').forEach(c=>c.classList.remove('obj-selected'));
  selectedNode = node;
  if(selectedNode) selectedNode.querySelectorAll('circle').forEach(c=>c.classList.add('obj-selected'));

// ── путевые характеристики (заглушка — формула скорости/топлива в ТЗ.md
// §2.7.4 ещё не зафиксирована) ─────────────────────────────────────────
function travelStats(o){
  const dr = o.r - centralWorld.r, dx = xOf(o) - centralWorld.x0;
  const dist = Math.sqrt(dr*dr + dx*dx);
  return {
    dist: dist.toFixed(0),
    jumps: Math.max(1, Math.ceil(dist/35)),
    time: (dist*0.4).toFixed(1),
    fuel: (dist*1.8).toFixed(0),
    inRange: dist <= ASSEMBLE_R,
  };
}
function rangeRow(ts){
  return ts.inRange ? '' : `<br><span style="color:#ff8060">вне круга перелётов</span>`;
}

let selectedObject = null;
function clearSelection(){
  selectVisual(null);
  selectedObject = null;
  document.getElementById('ts-name').textContent = '—';
  document.getElementById('tr-selected-rows').textContent = 'выберите объект на карте';
  document.getElementById('tr-planets').style.display = 'none';
}

function commonRows(o, head){
  const ts = travelStats(o);
  return `${head}<br>масса: <b>${o.mass.toFixed(2)} M☉</b><br>
     расстояние: <b>${ts.dist} кл</b><br>прыжков: <b>${ts.jumps}</b><br>
     время полёта: <b>~${ts.time} ч</b><br>расход топлива: <b>~${ts.fuel} ед</b>${rangeRow(ts)}`;
}

function showInfoForStar(o){
  selectedObject = o;
  document.getElementById('ts-name').textContent =
    o.stable ? FACTIONS[o.faction].name : `${STAR_NAMES[o.starType]} #${o.id}`;
  const head = o.stable
    ? (o.role==='capital' ? 'столица Империи · центр ассамбли' : 'феод-вассал')
    : `зона ${o.zone} · орбита ${o.r.toFixed(0)}`;
  document.getElementById('tr-selected-rows').innerHTML = commonRows(o, head);
  const pl = document.getElementById('tr-planets');
  pl.style.display = 'block';
  pl.innerHTML = '';
  (o.planets||[]).forEach((p,i)=>{
    const t = PLANET_TYPES[p.type] || {name:p.type, color:'#888'};
    const f = FACTIONS[p.owner] || FACTIONS.none;

    row.className = 'ip-row';

// Панель узкая (телефон), полную таблицу из 10 ресурсов туда не вместить —
// показываем в тосте три самых богатых и воду.
function showPlanetResources(p, i){
  const t = PLANET_TYPES[p.type] || {name:p.type};
  const top = Object.entries(p.res||{})
    .filter(([,v])=>v>0)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,3)
    .map(([k,v])=>`${RESOURCES[k]||k} ${v}`)

        (top || 'недра пусты') + (p.water ? `\nвода ${p.water}/100` : ''));
}

function showInfoGeneric(o, label){

  document.getElementById('ts-name').textContent = label;
  document.getElementById('tr-selected-rows').innerHTML =
    commonRows(o, `зона ${o.zone} · орбита ${o.r.toFixed(0)}`);

// ══════════════════════════════════════════════════════════════════════════
// Выбор объекта по клику — БЛИЖАЙШИЙ к точке клика, а не точное попадание в
// фигуру SVG. Точное попадание регулярно не срабатывает на реальном тапе:
// тела рисуются мелкими точками, курсор/палец редко попадает миллиметр в
// миллиметр. То же решение уже было в архивном прототипе (galaxy.html,
// findNearest) — здесь тот же принцип, адаптированный под SVG viewBox вместо
// canvas.
// ══════════════════════════════════════════════════════════════════════════
const TAP_HIT_PX = 16; // минимальный радиус «попадания» клика, экранные px
function findNearestObject(clientX, clientY){
  const pt = clientToUser(clientX, clientY, vb);
  const rect = svg.getBoundingClientRect();
  const pxPerUnit = rect.width ? rect.width / vb.w : 1;
  let best = null, bestPx = Infinity;
  objects.forEach(o=>{
    const p = toXY(o.r, xOf(o));
    const d = Math.hypot(p.x - pt.x, p.y - pt.y) * pxPerUnit;
    const limit = Math.max(TAP_HIT_PX, bodyRadius(o) * pxPerUnit);
    if(d <= limit && d < bestPx){ bestPx = d; best = o; }
  });
  return best;
}

svg.addEventListener('click', (e)=>{
  if(suppressClick){ suppressClick=false; return; }
  const o = findNearestObject(e.clientX, e.clientY);
  if(!o){ clearSelection(); return; }
  selectVisual(o._node);
  if(o.type==='star'){
    showInfoForStar(o);
    toast(o.stable
      ? `${FACTIONS[o.faction].name} — стабильный мир, зона ${o.zone}${o.role==='capital'?' (столица Империи, центр ассамбли)':' (феод-вассал)'}`
      : `${STAR_NAMES[o.starType]} #${o.id} — зона ${o.zone}`);
  } else if(o.type==='bh'){
    showInfoGeneric(o, `Чёрная дыра #${o.id}`);
    toast(`Чёрная дыра #${o.id} — зона ${o.zone}${o.chaotic?' (хаотичное движение, опасна для звёзд)':''}`);
  } else if(o.type==='neb'){
    showInfoGeneric(o, 'Туманность');
    toast(`Туманность — зона ${o.zone}`);
  } else {
    showInfoGeneric(o, 'Астероидное поле');
    toast(`Астероидное поле — зона ${o.zone}`);
  }
});

// ══════════════════════════════════════════════════════════════════════════
// Зум и панорамирование: колесо мыши на десктопе, pinch двумя пальцами и
// перетаскивание одним — на мобильном, одинаково через Pointer Events.
// ══════════════════════════════════════════════════════════════════════════
let vb = { x:0, y:0, w:300, h:300 };
const VB_MIN = 70, VB_MAX = 300, VB_PAD = 60;
function applyVB(){
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  applyBodySizes(); // тела сжимаются к истинному размеру по мере приближения
}
function clampVB(){
  vb.w = Math.max(VB_MIN, Math.min(VB_MAX, vb.w));
  vb.h = vb.w;
  vb.x = Math.max(-VB_PAD, Math.min(300-vb.w+VB_PAD, vb.x));
  vb.y = Math.max(-VB_PAD, Math.min(300-vb.h+VB_PAD, vb.y));
}
function clientToUser(clientX, clientY, box){
  const rect = svg.getBoundingClientRect();
  return {
    x: box.x + (clientX-rect.left)/rect.width*box.w,
    y: box.y + (clientY-rect.top)/rect.height*box.h,
  };
}
function zoomAt(clientX, clientY, factor){
  const pt = clientToUser(clientX, clientY, vb);
  const newW = Math.max(VB_MIN, Math.min(VB_MAX, vb.w*factor));
  const ratio = newW/vb.w;
  vb.x = pt.x - (pt.x-vb.x)*ratio;
  vb.y = pt.y - (pt.y-vb.y)*ratio;
  vb.w = newW; vb.h = newW;
  clampVB();
  applyVB();
}

svg.addEventListener('wheel', (e)=>{
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY>0 ? 1.15 : 0.87);
}, {passive:false});

let suppressClick = false;
const activePointers = new Map();
let panState = null, pinchState = null;

svg.addEventListener('pointerdown', (e)=>{
  svg.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(activePointers.size===1){
    panState = { startX:e.clientX, startY:e.clientY, vb0:{...vb}, moved:0 };
    svg.classList.add('panning');
  } else if(activePointers.size===2){
    panState = null;
    const pts = [...activePointers.values()];
    pinchState = {
      dist: Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y),
      vb0: {...vb},
      midClient: { x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2 },
    };
  }
});
svg.addEventListener('pointermove', (e)=>{
  if(!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(activePointers.size===2 && pinchState){
    const pts = [...activePointers.values()];
    const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    const factor = pinchState.dist / Math.max(1,dist);
    const newW = Math.max(VB_MIN, Math.min(VB_MAX, pinchState.vb0.w*factor));
    const ratio = newW/pinchState.vb0.w;
    const pt = clientToUser(pinchState.midClient.x, pinchState.midClient.y, pinchState.vb0);
    vb.x = pt.x - (pt.x-pinchState.vb0.x)*ratio;
    vb.y = pt.y - (pt.y-pinchState.vb0.y)*ratio;
    vb.w = newW; vb.h = newW;
    clampVB();
    applyVB();
    suppressClick = true;
  } else if(activePointers.size===1 && panState){
    const rect = svg.getBoundingClientRect();
    const dxUser = (e.clientX-panState.startX)/rect.width*panState.vb0.w;
    const dyUser = (e.clientY-panState.startY)/rect.height*panState.vb0.h;
    panState.moved = Math.max(panState.moved, Math.hypot(e.clientX-panState.startX, e.clientY-panState.startY));
    vb.x = panState.vb0.x - dxUser;
    vb.y = panState.vb0.y - dyUser;
    clampVB();
    applyVB();
    if(panState.moved > 5) suppressClick = true;
  }
});
function endPointer(e){
  activePointers.delete(e.pointerId);
  if(activePointers.size < 2) pinchState = null;
  if(activePointers.size < 1){ panState = null; svg.classList.remove('panning'); }
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);
svg.addEventListener('pointerleave', (e)=>{ if(activePointers.size<=1) endPointer(e); });

// ── список стабильных миров (верхняя левая панель) ────────────────────────
function renderStableList(){
  const wrap = document.getElementById('tr-obj-rows');
  wrap.innerHTML = '';
  [...objects.values()].filter(o=>o.stable).forEach(o=>{
    const row = document.createElement('div');
    row.className = 'tr-obj-row';
    row.textContent = FACTIONS[o.faction].name;
    wrap.appendChild(row);
  });
}

// ══════════════════════════════════════════════════════════════════════════
// Флоты игрока — реальные данные с сервера (server/fleets.go), не заглушка:
// один флот на каждый из 4 стабильных миров (столица + 3 вассала). Летает и
// рисуется на всех экранах только ТЕКУЩИЙ флот (Current==true) — это тот же
// `ship`, что и everywhere в проекте; остальные три стоят на орбите родного
// мира и отдают только имя/класс/позицию — их незачем разыгрывать целым
// миром, раз они никуда не двигаются (см. комментарий в fleets.go).
// ══════════════════════════════════════════════════════════════════════════
let fleetIndex = 0; // какой флот сейчас ПОКАЗАН в списке/нижней панели, не обязательно текущий
function fleetStatusText(f){
  if(!f.current){
    const home = objects.get(f.homeStarId);
    return home ? `на орбите ${home.stable ? FACTIONS[home.faction].name : (STAR_NAMES[home.starType]||home.starType)}` : 'позиция неизвестна';
  }
  const ship = World.state.ship;
  if(!ship) return '—';
  if(ship.landed) return 'на поверхности планеты';
  if(ship.transit) return ship.transit.mode==='interstellar' ? 'в межзвёздном перелёте' : 'в полёте';
  const home = objects.get(ship.systemStarId);
  return home ? `в системе ${home.stable ? FACTIONS[home.faction].name : (STAR_NAMES[home.starType]||home.starType)}` : 'в системе';
}
function renderFleetLists(){
  const fleets = World.state.fleets;
  const rows = document.getElementById('fleet-rows');
  if(!fleets || !fleets.length){ rows.innerHTML = ''; return; }
  if(fleetIndex >= fleets.length) fleetIndex = 0;
  rows.innerHTML = '';
  fleets.forEach((f,i)=>{
    const row = document.createElement('div');
    row.className = 'sl-row' + (i===fleetIndex ? ' active' : '');
    row.textContent = f.name + (f.current ? ' ★' : '');
    row.onclick = ()=>{ fleetIndex=i; renderFleetLists(); };
    rows.appendChild(row);
  });
  updateFleetStatus();
}
function updateFleetStatus(){
  const fleets = World.state.fleets;
  if(!fleets || !fleets.length) return;
  const f = fleets[fleetIndex];
  document.getElementById('bs-name').textContent = f.shipClass;
  document.getElementById('bs-sub').textContent = `${f.name} · ${fleetStatusText(f)}`;
}
document.getElementById('bb-prev').onclick = ()=>{
  const fleets = World.state.fleets; if(!fleets || !fleets.length) return;
  fleetIndex=(fleetIndex+fleets.length-1)%fleets.length; renderFleetLists(); toast(`Флот: ${fleets[fleetIndex].name}`);
};
document.getElementById('bb-next').onclick = ()=>{
  const fleets = World.state.fleets; if(!fleets || !fleets.length) return;
  fleetIndex=(fleetIndex+1)%fleets.length; renderFleetLists(); toast(`Флот: ${fleets[fleetIndex].name}`);
};
// Настоящая навигация (ship.go): целью может быть только звезда (§2.7.1
// ТЗ.md — «конкретный объект, звезда или планета», планету у чужой звезды
// сначала выбираем прилетев к ней — см. system.html). Летать может только
// ТЕКУЩИЙ флот — у остальных пока нет собственной симуляции полёта.
document.getElementById('bb-fly').onclick = async ()=>{
  const fleets = World.state.fleets;
  const viewed = fleets && fleets[fleetIndex];
  if(viewed && !viewed.current){ toast(`«${viewed.name}» пока не управляется игроком — доступен только текущий флот`); return; }
  if(!selectedObject){ toast('Сначала выберите объект на карте'); return; }
  if(selectedObject.type !== 'star'){ toast('Целью полёта может быть только звезда или планета — не туманность/астероид/ЧД'); return; }
  const name = selectedObject.stable ? FACTIONS[selectedObject.faction].name : `${STAR_NAMES[selectedObject.starType]} #${selectedObject.id}`;
  try{
    const data = await World.navigate('star', selectedObject.id);
    if(data.transit){
      const eta = Math.max(0, (new Date(data.transit.arriveAt) - new Date(data.transit.departedAt))/1000);
      toast(`${viewed ? viewed.name : 'Флот'} → курс на «${name}»\n${data.transit.mode==='interstellar'?'межзвёздный перелёт':'полёт внутри системы'}, ETA ~${eta.toFixed(0)} с`);
    } else {
      toast(`${viewed ? viewed.name : 'Флот'} уже в системе «${name}»`);
    }
  }catch(e){ toast('Не удалось проложить курс: ' + e.message); }
};
World.subscribe(renderFleetLists);
renderFleetLists();

// ══════════════════════════════════════════════════════════════════════════
// Маркер корабля на карте сектора.
//
// Состояние корабля — из общего модуля (World.state.ship): свой опрос
// /api/ship здесь не нужен, корабль один на все экраны. А вот положение его
// ЗВЕЗДЫ берём из локального `objects` — это состав сектора, который карта
// ведёт по SSE-потоку (4 кадра в секунду), он на этом масштабе точнее, чем
// секундный опрос.
//
// Во время меж-звёздного перелёта звезды под кораблём нет вовсе: тогда
// интерполируем From→To по доле пройденного времени, как и на system.html.
// ══════════════════════════════════════════════════════════════════════════
let shipMarkerNode = null;
function shipSectorPos(){
  const ship = World.state.ship;
  if(!ship) return null;
  const tr = ship.transit;
  if(tr && tr.mode === 'interstellar'){
    const departed = new Date(tr.departedAt).getTime();
    const arrive = new Date(tr.arriveAt).getTime();
    const frac = arrive>departed ? Math.min(1, Math.max(0, (Date.now()-departed)/(arrive-departed))) : 1;
    return { r: tr.fromR + (tr.toR-tr.fromR)*frac, x: tr.fromArc + (tr.toArc-tr.fromArc)*frac };
  }
  const starObj = objects.get(ship.systemStarId);
  if(!starObj) return null;
  return { r: starObj.r, x: xOf(starObj) };
}
// Размер маркера, в отличие от объектов сектора, НЕ истинный и не зависит от
// зума: это значок «вы здесь», а не тело со своими размерами. Радиус задан в
// единицах viewBox, поэтому при приближении раздувался бы сам собой — держим
// его постоянным в пикселях.
const SHIP_MARKER_PX = 4; // радиус значка на экране, px
function renderShipMarker(){
  const pos = shipSectorPos();
  if(!pos) return;
  const p = toXY(pos.r, pos.x);
  if(!shipMarkerNode){
    shipMarkerNode = el('circle', {fill:'#00e5ff', stroke:'#fff'});
    svg.appendChild(shipMarkerNode); // поверх всех объектов и кольца ассамбли
  }
  const w = svg.getBoundingClientRect().width;
  const r = w ? SHIP_MARKER_PX * vb.w / w : 2;
  shipMarkerNode.setAttribute('r', r);
  shipMarkerNode.setAttribute('stroke-width', r * 0.2);
  shipMarkerNode.setAttribute('cx', p.x);
  shipMarkerNode.setAttribute('cy', p.y);
}
World.start();

// ══════════════════════════════════════════════════════════════════════════
// Кадр: положение каждого объекта — чистая функция серверного времени.
// Никакого накопления по кадрам, поэтому просадка FPS или уход вкладки в фон
// не сдвигают картинку относительно сервера: вернувшись, она сразу на месте.
// ══════════════════════════════════════════════════════════════════════════
function frame(now){
  if(clock.connected){
    const t = gameMonths();
    objects.forEach(o=>{ if(o.arc) updateObjectPos(o, t); });
  }
  renderShipMarker();
  requestAnimationFrame(frame);
}

// ── запуск ────────────────────────────────────────────────────────────────
drawDefs();
drawGrid();
objLayer = el('g',{id:'obj-layer'});
svg.appendChild(objLayer);

loadGalaxy()
  .then(()=>{ connectEvents(); requestAnimationFrame(frame); })
  .catch(err=>{
    showOffline('Карта работает только через сервер.<br><br>Запустите <b>server/ouroboros-server.exe</b><br>и откройте адрес, который он покажет.<br><br>' + err);
    requestAnimationFrame(frame);
  });
</script>
