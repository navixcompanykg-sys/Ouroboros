<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<title>Уроборос · Планета</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="view"></canvas>

<div id="hud" class="glass">
  <div>
    <div class="t"><span id="h-dot"></span><span id="h-name"></span></div>
    <div class="s" id="h-type"></div>
    <div class="s" id="h-env"></div>
    <div class="s bhline" id="h-bh" hidden></div>
  </div>
</div>

<div id="tools">
  <button id="b-system" title="Карта звёздной системы">Система</button>
  <button id="b-takeoff" class="primary" title="Вернуться на орбиту">Взлёт</button>
</div>

<div id="layers" class="glass"></div>

<div id="card" class="glass">
  <div class="c-head">
    <div id="c-swatch"></div>
    <div><div id="c-name"></div><div id="c-type"></div></div>
    <button id="c-close" aria-label="Закрыть" hidden>✕</button>
  </div>
  <div id="c-body"></div>
</div>

<div id="hint">Щелчок по гексу — его ресурсы · сверху слева — слой: местность или ресурс</div>

<script src="js/data.js"></script>
<script src="js/gen.js"></script>
<script src="js/galaxy-gen.js"></script>
<script src="js/surface.js"></script>
<script src="js/viewport.js"></script>
<script src="js/world.js"></script>
<script src="js/planet.js"></script>
<script>setTimeout(() => { const h = document.getElementById('hint'); if (h) h.style.opacity = 0; }, 8000);</script>
</body>
</html>
