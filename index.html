<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<title>Уроборос · Галактика</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="view"></canvas>

<div id="hud" class="glass">
  <div>
    <div class="t"><span id="h-star"></span> <span id="h-seed"></span></div>
    <div class="s" id="h-class"></div>
    <div class="s" id="h-gal"></div>
  </div>
</div>

<div id="gauges" class="glass"><div id="g-speed"></div><div id="g-fuel"></div></div>
<div id="tools">
  <a class="btn" href="menu.html" title="Меню игры">Меню</a>
  <button id="b-ship" title="Перейти в систему корабля">Корабль</button>
  <button id="b-fit" title="Вся галактика">Галактика</button>
  <button id="b-grid" class="on" title="Сетка зон и секторов">Сетка</button>
  <button id="b-newgal" title="Сгенерировать новую галактику">Новый мир</button>
</div>

<div id="card" class="glass" hidden>
  <div class="c-head">
    <div id="c-swatch"></div>
    <div><div id="c-name"></div><div id="c-type"></div></div>
    <button id="c-close" aria-label="Закрыть">✕</button>
  </div>
  <div id="c-facts"></div>
  <div id="c-desc"></div>
  <label id="c-dest-wrap" hidden><span>Цель в системе</span><select id="c-dest"></select></label>
  <div class="actions">
    <button id="b-warp-eco" hidden title="Двигатели на половине мощности: дольше, топлива меньше (реактор покрывает бо́льшую долю)">Экономно</button>
    <button id="b-jump" class="primary" hidden>Быстро</button>
  </div>
  <div id="c-list" hidden></div>
</div>

<div id="h-scale" class="glass"></div>

<div id="hint">Щелчок по звезде — карточка и перелёт · по пустому месту — сектор · колесо/щипок — масштаб</div>

<script src="js/data.js"></script>
<script src="js/gen.js"></script>
<script src="js/galaxy-gen.js"></script>
<script src="js/surface.js"></script>
<script src="js/viewport.js"></script>
<script src="js/world.js"></script>
<script src="js/ships.js"></script>
<script src="js/galaxy.js"></script>
<script>setTimeout(() => { const h = document.getElementById('hint'); if (h) h.style.opacity = 0; }, 8000);</script>
</body>
</html>
